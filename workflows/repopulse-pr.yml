name: RepoPulse PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: AI Code Review
        uses: actions/github-script@v7
        with:
          script: |
            const { data: diff } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const files = diff.changed_files;
            const additions = diff.additions;
            const deletions = diff.deletions;

            let review = '## RepoPulse AI Review\n\n';
            review += `**Files changed:** ${files}\n`;
            review += `**Additions:** ${additions}\n`;
            review += `**Deletions:** ${deletions}\n\n`;

            if (files > 20) {
              review += '⚠️ Large PR detected — consider splitting into smaller changes.\n';
            }
            review += '✅ PR structure looks good.';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: review,
            });
